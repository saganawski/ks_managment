<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Office</title>
    <link rel="shortcut icon" href="#">
<script src="../external-resources.js"></script>

    <link rel="stylesheet" href="/common/style.css">
    <script src="/office/js/new-office.js"></script>
</head>
<body>
    <div id="load-layout">
        <main>
            <div class="text-center">
                <div class="spinner-border" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
            <div class="card col-lg-10">
                <div class="card-header">
                    New Office Creation
                </div>
                <div class="card-body">
                    <form id="office-form" class="needs-validation" novalidate>

                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label>Office Name</label>
                                <input type="text" id="name" name="name" class="form-control" required/>
                                <div class="invalid-feedback">
                                    Field is Required!
                                </div>
                            </div>
                            <div class="form-group col-md-3">
                                <label>Is Completed?</label>
                                <select id="completed" name="completed" class="custom-select" required>
                                    <option value="true">Yes</option>
                                    <option value="false" selected>No</option>
                                </select>
                            </div>
                        </div>
                        <h5>Location Details</h5>
                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label>State Name</label>
                                <input type="text" id="stateName" name="stateName" class="form-control" required/>
                                <div class="invalid-feedback">
                                    Field is Required!
                                </div>
                            </div>
                            <div class="form-group col-md-3">
                                <label>City Name</label>
                                <input type="text" id="cityName" name="cityName" class="form-control" required>
                                </input>
                                <div class="invalid-feedback">
                                    Field is Required!
                                </div>
                            </div>
                            <div class="form-group col-md-3">
                                <label>Address 1</label>
                                <input type="text" id="address1" name="address1" class="form-control" required>
                                </input>
                                <div class="invalid-feedback">
                                    Field is Required!
                                </div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label>Address 2</label>
                                <input type="text" id="address2" name="address2" class="form-control" >
                                </input>
                                <div class="invalid-feedback">
                                    Field is Required!
                                </div>
                            </div>
                            <div class="form-group col-md-3">
                                <label>Zip</label>
                                <input type="text" id="zip" name="zip" class="form-control" required/>
                                <div class="invalid-feedback">
                                    Field is Required!
                                </div>
                            </div>

                        </div>
                        <div>
                            <button id="createOffice" value="send" type="submit" class="btn btn-primary">Create Office</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

</div>
</body>
</html>
