<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Employees</title>
<link rel="shortcut icon" href="#">
<script src="../external-resources.js"></script>

<link rel="stylesheet" href="/common/style.css">
<script src="/employee/js/employee.js"></script>
</head>
<body>
    <div id="load-layout">
        <main>
            <div class="text-center">
                <div id="initialLoad" class="spinner-border" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
            <a class="btn btn-success" href="/employee/new-employee.html" role="button" style="margin-bottom: 5px">Add Employee</a>
            <table id="employee-table" class="display" style="width: 100%">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Position</th>
                    <th>Office</th>
                    <th>Phone</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Separation Type</th>
                    <th>Activation Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
            </table>
        </main>
    </div>

</body>
</html>
