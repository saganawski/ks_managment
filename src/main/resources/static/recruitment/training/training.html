<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Trainings</title>
    <link rel="shortcut icon" href="#">
<script src="../../external-resources.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.flash.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.html5.min.js"></script>
    <!--    Moment pluggin-->
    <script src="/pluggins/moment/moment.min.js"></script>

    <link rel="stylesheet" href="/common/style.css">
    <script src="/recruitment/training/js/training.js"></script>
</head>
<body>
    <div id="load-layout">
        <main>
            <div class="text-center">
                <h2>First Day Training Schedule</h2>
                <div id="initialLoad" class="spinner-border" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
            <button id="officeButton" class="btn btn-warning add-app-btn" role="button">Choose Office</button>
            <table id="trainer-table" class="display">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Trainee</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Scheduled Time</th>
                    <th>Trainer</th>
                    <th>Office Name</th>
                    <th>Actions</th>
                </tr>
                </thead>
            </table>
        </main>
    </div>

    <!--        Choose Office MODAL-->
    <div class="modal fade" id="officeModal" tabindex="-1" role="dialog" aria-labelledby="officeModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="text-center">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
                <div class="modal-header">
                    <h5 class="modal-title" >Choose Office to display trainings</h5>
                </div>
                <div class="modal-body">
                    <form id="officeForm" class="needs-validation" novalidate>
                        <div class="form-group col-md-3 col-lg-9">
                            <label>Choose Office</label>
                            <select id="officeSelect" name="office" data-live-search="true" required>
                                <option value="">Choose an office</option>
                            </select>
                            <div class="invalid-feedback">
                                Must Choose office!
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button id="officeFormSubmit" class="btn btn-primary" value="send" type="submit">Display Trainings</button>

                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
