<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>New Employee</title>
<link rel="shortcut icon" href="#">
<script src="../../external-resources.js"></script>

<link rel="stylesheet" href="/common/style.css">
<script src="/reports/shift-goal/js/new-project.js"></script>
</head>
<body>
	<div id="load-layout">
		<main>
			<form id="project-form" class="needs-validation" novalidate>
				<div class="form-row">
					<div class="form-group col-md-3">
						<label>Name</label>
						<input type="text" id="name" name="name" class="form-control" required/>
						<div class="invalid-feedback">
							Field is Required!
						</div>
					</div>
				</div>
				<div class="form-row">
					<div class="form-group col-md-3">
						<label>Office</label>
						<select id="officeSelect" name="office" class="form-control" required>
							<option value="" selected>Choose Office</option>
						</select>
						<div class="invalid-feedback">
							Field is Required!
						</div>
					</div>
				</div>

				<button id="newProject" value="send" type="submit" class="btn btn-primary">Create Project</button>
			</form>
		</main>
	</div>

</body>
</html>
