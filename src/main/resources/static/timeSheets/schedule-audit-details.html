<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audit Details</title>
    <link rel="shortcut icon" href="#">
<script src="../external-resources.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.flash.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.html5.min.js"></script>
    <!--    Moment pluggin-->
    <script src="/pluggins/moment/moment.min.js"></script>

    <link rel="stylesheet" href="/common/style.css">
    <script src="/timeSheets/js/schedule-audit-details.js"></script>
</head>
<body>
    <div id="load-layout">
        <main>
            <div class="text-center">
                <div id="initialLoad" class="spinner-border" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
            <div class="card col-lg-10" style="margin:15px;">
                <div class="card-header">
                    Schedule Audit Report
                </div>
                <div class="card-body table-responsive">
                        <a id="delete-report" class="btn btn-danger" href="#" role="button" style="margin-bottom: 5px">Delete Report</a>
                        <table id="schedule-audit-table" class="display">
                            <thead>
                            <tr>
                                <th>Id</th>
                                <th>Scheduled Day</th>
                                <th>Status</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Pay Rate</th>
                                <th>Time In</th>
                                <th>Time Out</th>
                                <th>Total Hours</th>
                                <th>Lunch</th>
                                <th>Mileage</th>
                                <th>Total Pay</th>
                                <th>Overtime</th>
                            </tr>
                            </thead>
                        </table>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
