<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payroll Details</title>
    <link rel="shortcut icon" href="#">
<script src="../external-resources.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.flash.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.html5.min.js"></script>

    <link rel="stylesheet" href="/common/style.css">
    <script src="/timeSheets/js/payroll-audit-details.js"></script>
</head>
<body>
    <div id="load-layout">
        <main>
            <div class="text-center">
                <div id="initialLoad" class="spinner-border" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
            <div class="card col-lg-10" style="margin:15px;">
                <div class="card-header" >
                    Payroll Report
                </div>
                <div class="card-body table-responsive">
                        <a id="delete-report" class="btn btn-danger" href="#" role="button" style="margin-bottom: 5px">Delete Report</a>
                        <table id="schedule-audit-table">
                            <thead>
                                <tr>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Hours</th>
                                    <th>Hourly Rate</th>
                                    <th>Hourly Pay</th>
                                    <th>Overtime Hours</th>
                                    <th>Overtime Rate</th>
                                    <th>Overtime Pay</th>
                                    <th>Mileage</th>
                                    <th>Mileage Pay</th>
                                    <th>Total Pay</th>
                                </tr>
                            </thead>
                            <tfoot align="right">
                            <tr>
                                <th></th>
                                <th></th>
                                <th></th>
                                <th></th>
                                <th></th>
                                <th></th>
                                <th></th>
                                <th></th>
                                <th></th>
                                <th></th>
                                <th></th>
                            </tr>
                            </tfoot>
                        </table>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
