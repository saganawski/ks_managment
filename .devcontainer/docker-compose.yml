version: "3.9"
services:
  db:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_USER: spring
      MYSQL_PASSWORD: springpw
      MYSQL_DATABASE: management
    healthcheck:
#      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-pspringpw" ]
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpw --silent"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    ports: ["3306:3306"]
    volumes: [dbdata:/var/lib/mysql]

  app:
    user: "${UID}:${GID}"
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file: ../.env.dev
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "./mvnw spring-boot:run
             -Dspring-boot.run.jvmArguments='
               -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'"
    volumes:
      - ..:/workspace:cached
    ports: ["8080:8080", "5005:5005"]

volumes:
  dbdata:
